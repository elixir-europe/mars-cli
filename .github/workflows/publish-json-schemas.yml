name: Propose JSON schema update to MARS

# When the pydantic models change on main, regenerate the JSON schemas and open
# (or update) a pull request on elixir-europe/MARS with the result.
#
# Needs the repository secret MARS_SCHEMAS_TOKEN: a fine-grained personal access
# token (or a GitHub App installation token) for elixir-europe/MARS with
# "Contents: read and write" and "Pull requests: read and write".
# The default GITHUB_TOKEN cannot push to another repository.

on:
  push:
    branches: [main]
    paths:
      - "mars_lib/models/**"
      - "scripts/generate_json_schemas.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/publish-json-schemas.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-json-schemas
  cancel-in-progress: true

jobs:
  propose-schema-update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out mars-cli
        uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Check out MARS
        uses: actions/checkout@v5
        with:
          repository: elixir-europe/MARS
          ref: main
          path: mars-repo
          token: ${{ secrets.MARS_SCHEMAS_TOKEN }}

      - name: Generate the JSON schemas
        run: uv run python scripts/generate_json_schemas.py --output-dir mars-repo/schemas

      # No changes: no PR. An open PR on the same branch is updated in place.
      - name: Open or update the pull request on MARS
        uses: peter-evans/create-pull-request@v7
        with:
          path: mars-repo
          token: ${{ secrets.MARS_SCHEMAS_TOKEN }}
          branch: automated/json-schemas
          delete-branch: true
          add-paths: schemas/*.json
          commit-message: Update JSON schemas from mars-cli ${{ github.sha }}
          title: Update JSON schemas from the mars-cli models
          body: |
            Generated by `scripts/generate_json_schemas.py` in mars-cli from the pydantic models at
            ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}.

            Please don't edit these files by hand: change the models in mars-cli instead.
            This PR is updated automatically while it is open.
